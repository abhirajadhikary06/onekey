<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="static/images/favicon.ico" />
    <title>Dashboard - Onekey</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacOSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #111827;
        padding: 2rem;
        padding-top: 7rem;
      }

      /* Floating Navbar */
      .navbar {
        position: fixed;
        top: 2rem;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 4rem);
        max-width: 1200px;
        background: #ffffff;
        border: 4px solid #000000;
        border-radius: 16px;
        box-shadow: 6px 6px 0px #000000;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
      }

      .navbar-logo {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .navbar-logo img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      .navbar-logo span {
        font-size: 1.25rem;
        font-weight: 700;
        color: #000000;
      }

      .hamburger {
        width: 48px;
        height: 48px;
        background: #000000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: all 0.2s;
        box-shadow: 3px 3px 0px #666666;
      }

      .hamburger:hover {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #666666;
      }

      .hamburger:active {
        transform: translate(3px, 3px);
        box-shadow: 0px 0px 0px #666666;
      }

      .hamburger span {
        width: 24px;
        height: 3px;
        background: #ffffff;
        border-radius: 2px;
        transition: all 0.3s;
      }

      .hamburger.active span:nth-child(1) {
        transform: rotate(45deg) translate(6px, 6px);
      }

      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active span:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -6px);
      }

      .dropdown-menu {
        position: absolute;
        top: calc(100% + 1rem);
        right: 0;
        background: #ffffff;
        border: 4px solid #000000;
        border-radius: 12px;
        box-shadow: 6px 6px 0px #000000;
        min-width: 200px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s;
      }

      .dropdown-menu.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .dropdown-item {
        padding: 1rem 1.5rem;
        border: none;
        background: #ffffff;
        width: 100%;
        text-align: left;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        color: #000000;
        border-bottom: 3px solid #000000;
        display: flex;
        align-items: center;
      }

      .dropdown-item:last-child {
        border-bottom: none;
        border-radius: 0 0 8px 8px;
      }

      .dropdown-item:first-child {
        border-radius: 8px 8px 0 0;
      }

      .dropdown-item:hover {
        background: #f3f4f6;
      }

      .dropdown-item.logout {
        color: #dc2626;
      }

      .navbar-right {
        position: relative;
      }

      /* Container */
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        color: #000000;
        margin-bottom: 2rem;
      }

      /* Section Cards */
      .section {
        background: #ffffff;
        padding: 2rem;
        border-radius: 16px;
        border: 4px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        margin-bottom: 2rem;
      }

      h2 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #000000;
        margin-bottom: 1.5rem;
      }

      /* Grid Layout for Top Sections */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      /* Form Elements */
      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #000000;
        font-size: 0.95rem;
      }

      input,
      select {
        width: 100%;
        padding: 0.9rem 1rem;
        border: 3px solid #000000;
        border-radius: 8px;
        font-size: 1rem;
        background: #ffffff;
        transition: all 0.2s;
      }

      input:focus,
      select:focus {
        outline: none;
        transform: translateY(-2px);
        box-shadow: 4px 4px 0px #000000;
      }

      input::placeholder {
        color: #9ca3af;
      }

      /* Buttons */
      button {
        padding: 0.9rem 1.5rem;
        background: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 4px 4px 0px #666666;
      }

      button:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #666666;
      }

      button:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #666666;
      }

      /* Table */
      .table-container {
        overflow-x: auto;
        margin-top: 1rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 1rem;
        text-align: left;
        border-bottom: 3px solid #000000;
      }

      th {
        background: #f3f4f6;
        font-weight: 700;
        color: #000000;
      }

      td code {
        background: #f3f4f6;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.85rem;
        border: 2px solid #000000;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      /* Status Messages */
      #status,
      #addStatus,
      #keysStatus,
      #usageStatus {
        margin-top: 1rem;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .error {
        color: #dc2626;
      }

      .success {
        color: #16a34a;
      }

      /* Chart */
      canvas {
        max-height: 400px;
      }

      /* Action Buttons in Table */
      td button {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        box-shadow: 3px 3px 0px #666666;
      }

      td button:hover {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0px #666666;
      }

      .requestly-btn {
        background: #0f766e;
        box-shadow: 3px 3px 0px #115e59;
      }

      .requestly-btn:hover {
        box-shadow: 2px 2px 0px #115e59;
      }

      .requestly-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 2000;
      }

      .requestly-modal-card {
        width: min(1000px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: #ffffff;
        border: 4px solid #000000;
        border-radius: 16px;
        box-shadow: 8px 8px 0px #000000;
        padding: 1.25rem;
      }

      .requestly-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .requestly-header h3 {
        margin: 0;
        font-size: 1.15rem;
      }

      .requestly-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .requestly-block {
        border: 3px solid #000000;
        border-radius: 10px;
        background: #f9fafb;
        padding: 0.75rem;
      }

      .requestly-block h4 {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
      }

      .requestly-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .requestly-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      @media (max-width: 900px) {
        .requestly-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Key Limit Info */
      .key-limit-info {
        background: #f3f4f6;
        padding: 1rem;
        border-radius: 8px;
        border: 2px solid #000000;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .limit-text {
        font-weight: 600;
        color: #000000;
      }

      .limit-warning {
        color: #dc2626;
        font-weight: 600;
      }

      .limit-success {
        color: #16a34a;
        font-weight: 600;
      }

      .upgrade-button {
        background: #059669;
        padding: 0.75rem 1.5rem;
        box-shadow: 3px 3px 0px #047857;
      }

      .upgrade-button:hover {
        box-shadow: 2px 2px 0px #047857;
      }

      .subscription-badge {
        background: #fbbf24;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 2px solid #000000;
        font-weight: 600;
        color: #000000;
      }

      /* ── Unified API Key Block ── */
      .shared-key-block {
        background: #fff7cf;
        padding: 1.75rem 2rem;
        border-radius: 16px;
        border: 4px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .shared-key-left {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
        flex: 1;
      }

      .shared-key-label {
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6b7280;
      }

      .shared-key-title {
        font-size: 1.2rem;
        font-weight: 800;
        color: #000000;
      }

      .shared-key-code-wrap {
        margin-top: 0.6rem;
        background: #ffffff;
        border: 3px solid #000000;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        overflow: hidden;
      }

      .shared-key-code-wrap code {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.95rem;
        font-weight: 600;
        color: #111827;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      .shared-key-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      .copy-shared-key-btn {
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        background: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 4px 4px 0px #666666;
        white-space: nowrap;
      }

      .copy-shared-key-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #666666;
      }

      .copy-shared-key-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #666666;
      }

      .copy-shared-key-btn.copied {
        background: #16a34a;
        box-shadow: 4px 4px 0px #14532d;
      }

      .copy-shared-key-btn.copied:hover {
        box-shadow: 2px 2px 0px #14532d;
      }

      #sharedKeyStatus {
        font-size: 0.88rem;
        font-weight: 700;
        margin-top: 0.4rem;
      }

      @media (max-width: 900px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }

        .navbar {
          width: calc(100% - 2rem);
          top: 1rem;
        }

        body {
          padding-top: 6rem;
        }

        h1 {
          font-size: 2rem;
        }

        .shared-key-block {
          flex-direction: column;
          align-items: stretch;
        }

        .shared-key-actions {
          justify-content: flex-start;
        }
      }

      @media (max-width: 600px) {
        .navbar-logo span {
          display: none;
        }

        .section {
          padding: 1.5rem;
        }

        table {
          font-size: 0.85rem;
        }

        th,
        td {
          padding: 0.75rem 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Floating Navbar -->
    <nav class="navbar">
      <div class="navbar-logo">
        <img src="static/images/logo.png" alt="Onekey Logo" />
        <span>Onekey</span>
      </div>
      <div class="navbar-right">
        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" onclick="goProfile()"><img src="static/images/profile.png" alt="Profile" style="width: 20px; height: 20px; margin-right: 0.5rem; vertical-align: middle; object-fit: contain;"> Profile</button>
          <button class="dropdown-item" onclick="goCLI()"><img src="static/images/pypylogo.png" alt="PIP Package" style="width: 20px; height: 20px; margin-right: 0.5rem; vertical-align: middle; object-fit: contain;"> PIP Package</button>
          <button class="dropdown-item" onclick="goDocs()"><img src="static/images/docs.png" alt="Docs" style="width: 20px; height: 20px; margin-right: 0.5rem; vertical-align: middle; object-fit: contain;"> Docs</button>
          <button class="dropdown-item" onclick="goIntegrations()"><img src="static/images/integrations.png" alt="Integrations" style="width: 20px; height: 20px; margin-right: 0.5rem; vertical-align: middle; object-fit: contain;"> Integrations</button>
          <button class="dropdown-item logout" onclick="logout()"><img src="static/images/logout.png" alt="Logout" style="width: 20px; height: 20px; margin-right: 0.5rem; vertical-align: middle; object-fit: contain;"> Logout</button>
        </div>
      </div>
    </nav>

    <div class="container">
      <div style="margin-bottom: 4rem;"></div>

      <!-- Grid Layout for Top Two Sections -->
      <div class="grid-2">
        <!-- Section 1: Add New API Key -->
        <div class="section">
          <h2>Add New API Key</h2>
          <div class="key-limit-info" id="keyLimitInfo">
            <span class="limit-text">Keys: <span id="keyCount">0</span>/<span id="maxKeys">3</span></span>
            <button class="upgrade-button" id="upgradeBtn" onclick="goUpgrade()" style="display: none;">Upgrade to Premium</button>
          </div>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="keyName" placeholder="e.g. production-key" />
          </div>
          <div class="form-group">
            <label>API Key</label>
            <input type="text" id="apiKey" placeholder="sk-... or your key here" />
          </div>
          <div class="form-group">
            <label>Expiration (optional)</label>
            <input type="date" id="expiresAt" />
          </div>
          <button id="addKeyBtn" onclick="addKey()">Add Key</button>
          <p id="addStatus"></p>
        </div>

        <!-- Section 3: Usage Visualization -->
        <div class="section">
          <h2>Usage Overview</h2>
          <canvas id="usageChart"></canvas>
          <p id="usageStatus">Loading usage data...</p>
        </div>
      </div>

      <!-- Unified API Key Block -->
      <div class="shared-key-block">
        <div class="shared-key-left">
          <span class="shared-key-label">Your platform key</span>
          <span class="shared-key-title">Unified API Key</span>
          <div class="shared-key-code-wrap">
            <code id="platformApiKeyValue">Loading...</code>
          </div>
          <p id="sharedKeyStatus"></p>
        </div>
        <div class="shared-key-actions">
          <button class="copy-shared-key-btn" id="copyBtn" onclick="copyUnifiedApiKey()">
            Copy Key
          </button>
        </div>
      </div>

      <!-- Section 2: Your Stored Keys (Full Width) -->
      <div class="section">
        <h2>Your Stored Keys</h2>
        <div class="table-container">
          <table id="keysTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Provider</th>
                <th>Visible API Key</th>
                <th>Unified Endpoint</th>
                <th>Expires</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="keysStatus">Loading keys...</p>
      </div>
    </div>

    <script>
      // Toggle Dropdown Menu
      function toggleMenu() {
        const hamburger = document.getElementById('hamburger');
        const dropdown = document.getElementById('dropdownMenu');
        hamburger.classList.toggle('active');
        dropdown.classList.toggle('active');
      }

      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        const navbar = document.querySelector('.navbar-right');
        if (!navbar.contains(event.target)) {
          document.getElementById('hamburger').classList.remove('active');
          document.getElementById('dropdownMenu').classList.remove('active');
        }
      });

      // Handle token from URL (GitHub OAuth callback) or localStorage (JWT)
      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get("token");
      const authMethod = params.get("auth");
      
      let token = urlToken || localStorage.getItem("access_token");
      
      if (!token) {
        window.location.href = "/static/index.html";
      }
      
      if (urlToken) {
        localStorage.setItem("access_token", urlToken);
        window.history.replaceState({}, document.title, "/static/dashboard.html");
      }

      const headers = {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
      };

      let platformApiKey = "";

      function logout() {
        localStorage.removeItem("access_token");
        window.location.href = "/static/index.html";
      }

      function goProfile()      { window.location.href = "/static/profile.html"; }
      function goCLI()          { window.location.href = "/static/pip-package.html"; }
      function goDocs()         { window.location.href = "/static/docs.html"; }
      function goIntegrations() { window.location.href = "/static/integrations.html"; }

      function goUpgrade() {
        if (confirm("Upgrade to premium to add unlimited API keys? (This will be charged to your account)")) {
          upgradeAccount();
        }
      }

      async function loadUnifiedApiKey() {
        const keyCode = document.getElementById("platformApiKeyValue");
        const status  = document.getElementById("sharedKeyStatus");
        keyCode.textContent = "Loading...";
        status.textContent  = "";

        try {
          const res = await fetch("/keys/platform-key", { headers });
          if (!res.ok) throw new Error(await res.text());
          const payload = await res.json();
          platformApiKey = payload.platform_api_key || "";
          keyCode.textContent = platformApiKey || "Unavailable";
        } catch (err) {
          platformApiKey = "";
          keyCode.textContent  = "Unavailable";
          status.className     = "error";
          status.textContent   = "Error loading unified API key: " + err.message;
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function runRequestPreview(config) {
        const resp = await fetch(config.endpoint, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${config.platform_api_key}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(config.payload),
        });

        const text = await resp.text();
        let parsed = text;
        try {
          parsed = JSON.stringify(JSON.parse(text), null, 2);
        } catch (e) {
          // Keep plain text body when response is not JSON.
        }

        return {
          ok: resp.ok,
          status: resp.status,
          body: parsed,
        };
      }

      function closeRequestlyModal() {
        const modal = document.getElementById("requestlyModal");
        if (modal) modal.remove();
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          alert("Copied");
        } catch (err) {
          alert("Copy failed: " + err.message);
        }
      }

      function openRequestlyModal(config, preview, keyName) {
        closeRequestlyModal();
        const modal = document.createElement("div");
        modal.id = "requestlyModal";
        modal.className = "requestly-modal";
        modal.innerHTML = `
          <div class="requestly-modal-card">
            <div class="requestly-header">
              <h3>Requestly Test: ${escapeHtml(keyName)} (${escapeHtml(config.provider)})</h3>
              <button onclick="closeRequestlyModal()">Close</button>
            </div>
            <div class="requestly-grid">
              <div class="requestly-block">
                <h4>Python SDK</h4>
                <pre class="requestly-pre">${escapeHtml(config.python_sdk)}</pre>
                <div class="requestly-actions">
                  <button onclick="copyText(${JSON.stringify(config.python_sdk)})">Copy SDK</button>
                </div>
              </div>
              <div class="requestly-block">
                <h4>cURL</h4>
                <pre class="requestly-pre">${escapeHtml(config.curl)}</pre>
                <div class="requestly-actions">
                  <button onclick="copyText(${JSON.stringify(config.curl)})">Copy cURL</button>
                </div>
              </div>
              <div class="requestly-block">
                <h4>Request Payload</h4>
                <pre class="requestly-pre">${escapeHtml(JSON.stringify(config.payload, null, 2))}</pre>
              </div>
              <div class="requestly-block">
                <h4>Live Output (${preview.status})</h4>
                <pre class="requestly-pre">${escapeHtml(preview.body)}</pre>
                <div class="requestly-actions">
                  <button onclick="copyText(${JSON.stringify(preview.body)})">Copy Output</button>
                </div>
              </div>
            </div>
          </div>
        `;
        modal.addEventListener("click", (e) => {
          if (e.target.id === "requestlyModal") closeRequestlyModal();
        });
        document.body.appendChild(modal);
      }

      async function testWithRequestly(provider, keyName) {
        const requestlyTab = window.open("about:blank", "_blank");

        try {
          const cfgRes = await fetch("/keys/requestly-config", {
            method: "POST",
            headers,
            body: JSON.stringify({ provider }),
          });
          if (!cfgRes.ok) throw new Error(await cfgRes.text());
          const config = await cfgRes.json();

          if (requestlyTab) {
            requestlyTab.location.href = config.requestly_url || "https://requestly.com/";
          }

          const preview = await runRequestPreview(config);
          openRequestlyModal(config, preview, keyName);
        } catch (err) {
          if (requestlyTab) requestlyTab.close();
          alert("Requestly test failed: " + err.message);
        }
      }

      async function copyUnifiedApiKey() {
        const key    = document.getElementById("platformApiKeyValue").textContent || "";
        const status = document.getElementById("sharedKeyStatus");
        const btn    = document.getElementById("copyBtn");

        if (!key || key === "Loading..." || key === "Unavailable") {
          status.className   = "error";
          status.textContent = "Unified API key is not available yet.";
          return;
        }

        try {
          await navigator.clipboard.writeText(key);
          btn.textContent  = "✓ Copied!";
          btn.classList.add("copied");
          status.className   = "success";
          status.textContent = "Unified API key copied to clipboard.";
          setTimeout(() => {
            btn.textContent = "Copy Key";
            btn.classList.remove("copied");
            status.textContent = "";
          }, 2500);
        } catch (err) {
          status.className   = "error";
          status.textContent = "Could not copy: " + err.message;
        }
      }

      async function upgradeAccount() {
        const addStatus = document.getElementById("addStatus");

        try {
          addStatus.className = "";
          addStatus.textContent = "Creating secure checkout session...";

          const res = await fetch("/keys/upgrade", {
            method: "POST",
            headers,
            body: JSON.stringify({}),
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Upgrade failed");
          }

          const payload = await res.json();

          if (payload.status === "already_subscribed") {
            alert("You are already on premium.");
            addStatus.className = "success";
            addStatus.textContent = "✓ Already premium.";
            loadKeyStatus();
            return;
          }

          if (!payload.checkout_url || !payload.session_id) {
            throw new Error("Invalid checkout response from server");
          }

          // Persist session locally so returning checkout page can auto-verify premium.
          localStorage.setItem("onekey_pending_upgrade_session_id", payload.session_id);

          const checkoutTab = window.open(payload.checkout_url, "_blank");
          if (!checkoutTab) {
            window.location.href = payload.checkout_url;
            return;
          }

          addStatus.textContent = "Checkout opened. Waiting for payment confirmation...";
          const result = await waitForUpgradeCompletion(payload.session_id, 90, 4000);

          if (result.status === "paid" || result.is_subscribed) {
            localStorage.removeItem("onekey_pending_upgrade_session_id");
            addStatus.className = "success";
            addStatus.textContent = "✓ Payment verified. Premium is now active.";
            alert("✓ Payment successful. Premium unlocked.");
            loadKeyStatus();
          } else if (result.status === "failed") {
            localStorage.removeItem("onekey_pending_upgrade_session_id");
            addStatus.className = "error";
            addStatus.textContent = `Payment was not completed (${result.checkout_status || result.status}).`;
            alert("Payment failed or cancelled. Please try again.");
          } else {
            addStatus.className = "error";
            addStatus.textContent = "Still pending. You can refresh status after completing checkout.";
            alert("Payment is still pending. Complete checkout and try again.");
          }
        } catch (err) {
          addStatus.className = "error";
          addStatus.textContent = "Error: " + err.message;
          alert("Error: " + err.message);
        }
      }

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function waitForUpgradeCompletion(sessionId, maxAttempts = 60, delayMs = 5000) {
        for (let i = 0; i < maxAttempts; i++) {
          const res = await fetch(`/keys/upgrade/status/${encodeURIComponent(sessionId)}`, { headers });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "Failed to verify payment status");
          }

          const payload = await res.json();
          if (payload.status === "paid" || payload.is_subscribed || payload.status === "failed") {
            return payload;
          }

          await delay(delayMs);
        }

        return { status: "pending", is_subscribed: false };
      }

      async function refreshPremiumAfterReturn() {
        const pendingSessionId = localStorage.getItem("onekey_pending_upgrade_session_id");
        if (!pendingSessionId) return;

        const addStatus = document.getElementById("addStatus");
        addStatus.className = "";
        addStatus.textContent = "Verifying payment status...";

        try {
          const result = await waitForUpgradeCompletion(pendingSessionId, 20, 3000);

          if (result.status === "paid" || result.is_subscribed) {
            localStorage.removeItem("onekey_pending_upgrade_session_id");
            addStatus.className = "success";
            addStatus.textContent = "✓ Premium is active. Key limit updated.";
            await loadKeyStatus();
            return;
          }

          if (result.status === "failed") {
            localStorage.removeItem("onekey_pending_upgrade_session_id");
            addStatus.className = "error";
            addStatus.textContent = "Payment was not completed.";
            return;
          }

          // Still pending, keep session id to check on next refresh.
          addStatus.className = "";
          addStatus.textContent = "Payment still pending. Complete checkout and refresh this page.";
        } catch (err) {
          addStatus.className = "error";
          addStatus.textContent = "Could not verify payment status right now.";
        }
      }

      async function addKey() {
        const name       = document.getElementById("keyName").value.trim();
        const apiKey     = document.getElementById("apiKey").value.trim();
        const expiresRaw = document.getElementById("expiresAt").value;
        const status     = document.getElementById("addStatus");

        if (!name || !apiKey) {
          status.className   = "error";
          status.textContent = "Name and API Key are required";
          return;
        }

        status.textContent = "Auto-detecting provider and adding key...";
        status.className   = "";

        const expires_at = expiresRaw ? new Date(expiresRaw).toISOString() : null;

        try {
          const res = await fetch("/keys", {
            method: "POST",
            headers,
            body: JSON.stringify({ name, key: apiKey, expires_at }),
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Failed to add key");
          }
          status.className   = "success";
          status.textContent = "✓ Key added successfully!";
          document.getElementById("keyName").value    = "";
          document.getElementById("apiKey").value     = "";
          document.getElementById("expiresAt").value  = "";
          loadKeys();
          loadKeyStatus();
        } catch (err) {
          status.className   = "error";
          status.textContent = "Error: " + err.message;
        }
      }

      function formatExpiry(expires_at) {
        if (!expires_at) return "Never";
        return new Date(expires_at).toLocaleDateString();
      }

      async function loadKeys() {
        const tbody  = document.querySelector("#keysTable tbody");
        const status = document.getElementById("keysStatus");
        tbody.innerHTML    = "";
        status.textContent = "Loading keys...";

        try {
          const res = await fetch("/keys", { headers });
          if (!res.ok) throw new Error(await res.text());
          const keys = await res.json();

          if (keys.length === 0) { status.textContent = "No keys stored yet."; return; }

          status.textContent = "";
          keys.forEach((k) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${k.name}</td>
              <td>${k.provider}</td>
              <td><code>${k.api_key}</code></td>
              <td><code>${k.unified_endpoint}</code></td>
              <td>${formatExpiry(k.expires_at)}</td>
              <td>${new Date(k.created_at).toLocaleString()}</td>
              <td>
                <button onclick="viewUsage(${k.id}, '${k.name.replace(/'/g, "\\'")}')">Usage</button>
                <button class="requestly-btn" onclick="testWithRequestly('${k.provider}', '${k.name.replace(/'/g, "\\'")}')">Requestly</button>
                <button onclick="deleteKey(${k.id})">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } catch (err) {
          status.className   = "error";
          status.textContent = "Error loading keys: " + err.message;
        }
      }

      async function deleteKey(id) {
        if (!confirm("Delete this key?")) return;
        try {
          const res = await fetch(`/keys/${id}`, { method: "DELETE", headers });
          if (!res.ok) throw new Error(await res.text());
          loadKeys();
          loadKeyStatus();
        } catch (err) {
          alert("Delete failed: " + err.message);
        }
      }

      function viewUsage(id, name) {
        window.location.href = `/static/key-usage.html?keyId=${id}&name=${encodeURIComponent(name)}`;
      }

      async function loadKeyStatus() {
        try {
          const res = await fetch("/keys/status", { headers });
          if (!res.ok) throw new Error(await res.text());
          const status = await res.json();

          document.getElementById("keyCount").textContent = status.key_count;
          document.getElementById("maxKeys").textContent  = status.max_keys || "∞";

          const addKeyBtn  = document.getElementById("addKeyBtn");
          const upgradeBtn = document.getElementById("upgradeBtn");
          const addStatus  = document.getElementById("addStatus");

          if (!status.is_subscribed && !status.can_add_more) {
            addKeyBtn.disabled       = true;
            upgradeBtn.style.display = "block";
            addStatus.className      = "error";
            addStatus.textContent    = "❌ Limit reached! Delete keys or upgrade to add more.";
          } else if (!status.is_subscribed && status.max_keys - status.key_count === 1) {
            addStatus.className   = "error";
            addStatus.textContent = "⚠️ You can add 1 more free key before limit.";
          } else {
            addKeyBtn.disabled       = false;
            upgradeBtn.style.display = "none";
            addStatus.textContent    = "";
          }
        } catch (err) {
          console.error("Error loading key status:", err.message);
        }
      }

      async function loadUsage() {
        const status = document.getElementById("usageStatus");
        status.textContent = "Loading usage...";

        try {
          const res = await fetch("/usage", { headers });
          if (!res.ok) throw new Error(await res.text());
          const logs = await res.json();

          status.textContent = logs.length ? "" : "No usage data yet.";

          const providers = {};
          logs.forEach((log) => {
            if (!providers[log.provider]) providers[log.provider] = 0;
            providers[log.provider] += log.total_tokens || 0;
          });

          const ctx = document.getElementById("usageChart").getContext("2d");
          new Chart(ctx, {
            type: "bar",
            data: {
              labels: Object.keys(providers),
              datasets: [{
                data: Object.values(providers),
                backgroundColor: ["#111827","#1f2937","#374151","#4b5563","#6b7280"],
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true } },
            },
          });
        } catch (err) {
          status.className   = "error";
          status.textContent = "Error loading usage: " + err.message;
        }
      }

      window.addEventListener("load", async () => {
        await loadKeyStatus();
        loadUnifiedApiKey();
        loadKeys();
        loadUsage();
        refreshPremiumAfterReturn();
      });
    </script>
    <script src="/static/chatbot.js"></script>
  </body>
</html>
